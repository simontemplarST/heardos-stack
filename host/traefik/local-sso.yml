# Local additions (2026-09-28): plain-http local domains + Authentik forward auth for Grocy.
http:
  middlewares:
    authentik-fwd:
      forwardAuth:
        address: http://authentik-1_migrated-authentik-1-1:9000/outpost.goauthentik.io/auth/traefik
        # trustForwardHeader is only safe while the web entrypoint trusts X-Forwarded-* from the lighthouse /32 alone
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
    strip-authentik:
      # empty value = remove header (Traefik). Clears every header authentik-fwd sets; applied at the web entrypoint
      # (entryPoints.web.http.middlewares) so a route that skips forwardAuth can never carry forged identity headers.
      headers:
        customRequestHeaders:
          X-authentik-username: ""
          X-authentik-email: ""
          X-authentik-groups: ""
          X-authentik-name: ""
          X-authentik-uid: ""
          X-authentik-jwt: ""
          X-authentik-meta-jwks: ""
          X-authentik-meta-outpost: ""
          X-authentik-meta-provider: ""
          X-authentik-meta-app: ""
          X-authentik-meta-version: ""
    noop:
      headers:
        customRequestHeaders:
          X-Runtipi-Local: "1"
  services:
    authentik-outpost:
      loadBalancer:
        servers:
          - url: http://authentik-1_migrated-authentik-1-1:9000
