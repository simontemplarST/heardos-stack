# Local additions (2026-09-28): plain-http local domains + Authentik forward auth for Grocy.
http:
  middlewares:
    authentik-fwd:
      forwardAuth:
        address: http://authentik-1_migrated-authentik-1-1:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
    strip-authentik:
      # empty value = remove header (Traefik). Used on LAN routes that bypass forwardAuth.
      headers:
        customRequestHeaders:
          X-authentik-username: ""
          X-authentik-email: ""
          X-authentik-groups: ""
    noop:
      headers:
        customRequestHeaders:
          X-Runtipi-Local: "1"
  services:
    authentik-outpost:
      loadBalancer:
        servers:
          - url: http://authentik-1_migrated-authentik-1-1:9000
