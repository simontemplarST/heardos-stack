# Local override (2026-10-14): the store compose sets INVIDIOUS_CONFIG inline; this repeats it and adds
# captcha_enabled: false — Invidious sits behind Authentik forward auth, so its own login/register captcha only annoys.
services:
  invidious:
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: tipi
          password: tipi
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: ${INVIDIOUS_COMPANION_KEY}
        hmac_key: ${INVIDIOUS_HMAC_KEY}
        use_innertube_for_captions: true
        domain: ${INVIDIOUS_DOMAIN}
        external_port: ${INVIDIOUS_EXTERNAL_PORT:-${APP_PORT}}
        https_only: ${INVIDIOUS_HTTPS_ONLY}
        captcha_enabled: false
