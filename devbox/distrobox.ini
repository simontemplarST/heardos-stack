# HeardOS operator / developer environment for the admin laptop.
#   distrobox assemble create --file devbox/distrobox.ini     # build (re-run with --replace after editing this file)
#   distrobox enter heardos-dev                                # then, once: devbox/setup.sh
# Fedora toolbox image: the box shares $HOME and the network namespace with the laptop, so ~/.ssh, ~/.config/credentials.env,
# the Nebula CA and the overlay (10.42.0.0/24, run by the laptop's own nebula service) are all usable inside.
[heardos-dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
init=false
start_now=true
# core tooling
additional_packages="git gh openssh-clients rsync curl jq bind-utils sqlite gettext aria2 nmap ShellCheck unzip gnupg2"
# python + the installer's GUI runtime (imgui-bundle needs GL/X11/Wayland client libs)
additional_packages="python3 python3-pip python3-devel gcc mesa-dri-drivers mesa-libGL libglvnd-glx libX11 libXrandr libXinerama libXcursor libXi libxkbcommon wayland-devel"
# edge + brand tooling: Caddy (validate Caddyfiles), Nebula (nebula-cert), ImageMagick (brand renders)
additional_packages="caddy nebula ImageMagick"
# smallstep CLI for the offline LAN CA root (not in Fedora's repos): a pinned release, checked against its sha256
# (from the release's checksums.txt) before dnf sees it. Bump version + hash together. (No $ here: assemble may eval it.)
init_hooks="rpm -q step-cli >/dev/null 2>&1 || { curl -fsSL -o /var/cache/step-cli-0.31.0.rpm https://github.com/smallstep/cli/releases/download/v0.31.0/step-cli-0.31.0-1.x86_64.rpm && echo '71a7f17d99e0e10209458553aab5561d51040b88c929691136dacb8ec2f849c6  /var/cache/step-cli-0.31.0.rpm' | sha256sum -c --quiet - && dnf -y -q install /var/cache/step-cli-0.31.0.rpm; rm -f /var/cache/step-cli-0.31.0.rpm; }"
