# example.com blog: static files built by blog-builder into /site/current (2026-10-18)
server {
    listen 80;
    server_name _;
    root /site/current;
    index index.html;
    server_tokens off;
    location / { try_files $uri $uri/ =404; }
    location = /feed.xml { default_type application/rss+xml; }
    location ~* \.css$ { expires 1h; }
}
