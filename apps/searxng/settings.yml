# HeardOS Search (rendered by 50-app.sh searxng with envsubst; edit here, not in data/searxng/config)
use_default_settings: true
general:
  instance_name: "${BRAND_TITLE} Search"
  donation_url: false
  contact_url: false
  enable_metrics: false
search:
  safe_search: 1
  autocomplete: duckduckgo
  default_lang: en-US
  formats: [html]
server:
  base_url: https://search.${DOMAIN}/
  limiter: true
  public_instance: false
  image_proxy: true
  method: GET
valkey:
  url: valkey://searxng-valkey:6379/0
ui:
  default_theme: simple
  theme_args:
    simple_style: dark
  query_in_title: false
  infinite_scroll: true
