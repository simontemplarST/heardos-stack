<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
<meta name="robots" content="noindex,nofollow" />
<title>Speed test</title>
<link rel="shortcut icon" href="favicon.ico">
<script type="text/javascript" src="speedtest.js"></script>
<script type="text/javascript">
// HeardOS 2026-10-13: stock page stripped to the test only (Alice: "remove EVERYthing from the page except the test").
// Stock copy kept beside this file as index.html.stock-6.3.0. Telemetry is off in settings.json.
var s=new Speedtest();
s.onupdate=function(data){
    I("dlText").textContent=(data.testState==1&&data.dlStatus==0)?"...":data.dlStatus;
    I("ulText").textContent=(data.testState==3&&data.ulStatus==0)?"...":data.ulStatus;
    I("pingText").textContent=data.pingStatus;
    I("jitText").textContent=data.jitterStatus;
    var prog=(Number(data.dlProgress)*2+Number(data.ulProgress)*2+Number(data.pingProgress))/5;
    I("progress").style.width=(100*prog)+"%";
};
s.onend=function(aborted){
    I("startStopBtn").className="";
    I("startStopBtn").setAttribute("aria-label","Start");
    if(aborted){initUI();}
};
function startStop(){
    if(s.getState()==3){s.abort();}
    else{s.start();I("startStopBtn").className="running";I("startStopBtn").setAttribute("aria-label","Abort");}
}
function initUI(){["dlText","ulText","pingText","jitText"].forEach(function(id){I(id).textContent="";});}
function I(id){return document.getElementById(id);}
</script>
<style type="text/css">
    html,body{border:none;padding:0;margin:0;background:#26272b;color:#f3f3f3;}
    body{text-align:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;justify-content:center;min-height:100vh;}
    #startStopBtn{display:inline-block;margin:0 auto;color:#f2a35e;background-color:transparent;border:0.15em solid #f2a35e;padding:0;font:inherit;font-size:1.3em;border-radius:0.3em;transition:all 0.3s;box-sizing:border-box;width:8em;height:3em;line-height:2.7em;cursor:pointer;}
    #startStopBtn:hover{background-color:rgba(245,166,35,0.12);}
    #startStopBtn.running{background-color:#C62828;border-color:#E53935;color:#fff;}
    #startStopBtn:before{content:"Start";}
    #startStopBtn.running:before{content:"Stop";}
    #test{margin-top:2em;}
    div.testArea{display:inline-block;width:14em;height:9em;position:relative;box-sizing:border-box;}
    div.testName{position:absolute;top:0.1em;left:0;width:100%;font-size:1.4em;z-index:9;color:#bdbdbd;}
    div.meterText{position:absolute;bottom:1.5em;left:0;width:100%;font-size:2.5em;z-index:9;font-variant-numeric:tabular-nums;}
    #dlText{color:#f2a35e;} #ulText{color:#8BC34A;} #pingText,#jitText{color:#90CAF9;}
    div.meterText:empty:before{color:#666 !important;content:"0.00";}
    div.unit{position:absolute;bottom:2em;left:0;width:100%;z-index:9;color:#9e9e9e;}
    div.testGroup{display:inline-block;}
    @media all and (max-width:65em){body{font-size:1.5vw;}}
    @media all and (max-width:40em){body{font-size:0.8em;}div.testGroup{display:block;margin:0 auto;}}
    #progressBar{width:90%;height:0.3em;background-color:#3a3a3d;position:relative;display:block;margin:0 auto 2em auto;}
    #progress{position:absolute;top:0;left:0;height:100%;width:0%;transition:width 2s;background-color:#f2a35e;}
</style>
</head>
<body>
<button id="startStopBtn" onclick="startStop()" aria-label="Start"></button>
<div id="test">
    <div id="progressBar"><div id="progress"></div></div>
    <div class="testGroup">
        <div class="testArea"><div class="testName">Download</div><div id="dlText" class="meterText"></div><div class="unit">Mbit/s</div></div>
        <div class="testArea"><div class="testName">Upload</div><div id="ulText" class="meterText"></div><div class="unit">Mbit/s</div></div>
    </div>
    <div class="testGroup">
        <div class="testArea"><div class="testName">Ping</div><div id="pingText" class="meterText"></div><div class="unit">ms</div></div>
        <div class="testArea"><div class="testName">Jitter</div><div id="jitText" class="meterText"></div><div class="unit">ms</div></div>
    </div>
</div>
<script type="text/javascript">initUI();</script>
</body>
</html>
