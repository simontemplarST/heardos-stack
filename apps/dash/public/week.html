<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>This week · HeardOS</title>
<style>
  :root { --bg:#26272b; --card:#2f2f32; --line:#3d3d41; --text:#f3f3f3; --muted:#a6a6ab; --amber:#f2a35e; --green:#8BC34A; --red:#EF5350; --blue:#90CAF9; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:baseline; gap:1rem; padding:1.1rem 1.25rem .5rem; flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.35rem; font-weight:600; letter-spacing:.02em; }
  header h1 span { color:var(--amber); }
  header .meta { color:var(--muted); font-size:.85rem; margin-left:auto; }
  header button { background:none; border:1px solid var(--amber); color:var(--amber); border-radius:.4rem; padding:.3rem .7rem; cursor:pointer; font:inherit; font-size:.85rem; }
  main { display:grid; gap:1rem; padding:0 1.25rem 2rem; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:.75rem; padding:1rem 1.1rem; min-width:0; }
  .card h2 { margin:0 0 .6rem; font-size:1rem; font-weight:600; color:var(--amber); display:flex; justify-content:space-between; align-items:baseline; }
  .card h2 a { color:var(--muted); font-size:.8rem; text-decoration:none; }
  .card h2 a:hover { color:var(--text); }
  .err { color:var(--red); font-size:.9rem; } .muted { color:var(--muted); } .small { font-size:.85rem; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  td, th { padding:.28rem .25rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); gap:.5rem; margin-bottom:.7rem; }
  .kpi { background:var(--bg); border-radius:.5rem; padding:.5rem .6rem; }
  .kpi .v { font-size:1.25rem; font-weight:600; font-variant-numeric: tabular-nums; } .kpi .l { color:var(--muted); font-size:.75rem; }
  ul.list { list-style:none; margin:0; padding:0; } ul.list li { padding:.22rem 0; border-bottom:1px solid var(--line); display:flex; gap:.5rem; }
  ul.list li .tag { color:var(--muted); font-size:.75rem; margin-left:auto; white-space:nowrap; }
  .day { font-weight:600; color:var(--blue); } .today .day { color:var(--amber); }
  .bar { height:.35rem; background:var(--bg); border-radius:.2rem; overflow:hidden; } .bar i { display:block; height:100%; background:var(--green); }
  .bar i.over { background:var(--red); }
  body.in-desktop header { padding-top:.7rem; }
  @media (max-width:600px){ header{padding:.9rem 1rem .4rem;} main{padding:0 1rem 1.5rem;} }
</style>
</head>
<body>
<header>
  <h1><span>This</span> week</h1>
  <div class="meta"><span id="stamp">loading…</span> <button id="refresh" title="Fetch fresh data from every source">refresh</button></div>
</header>
<main id="main"></main>
<script src="/week.js"></script>
</body>
</html>
