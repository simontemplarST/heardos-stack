name: installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# least privilege by default; jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: installer}}
    steps:
      - uses: actions/checkout@<CALENDAR_ID> # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@<CALENDAR_ID> # v5
        with: {python-version: "3.12"}
      # every dependency (and the build backend) pinned by hash; regenerate with:
      #   uv pip compile pyproject.toml build-requirements.in --extra dev --universal --python-version 3.12 --generate-hashes -o requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: pytest -q tests/unit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write        # build provenance (tags only)
      attestations: write
    defaults: {run: {working-directory: installer}}
    steps:
      - uses: actions/checkout@<CALENDAR_ID> # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@<CALENDAR_ID> # v5
        with: {python-version: "3.12"}
      # every dependency (and the build backend) pinned by hash; regenerate with:
      #   uv pip compile pyproject.toml build-requirements.in --extra dev --universal --python-version 3.12 --generate-hashes -o requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: pyinstaller --noconfirm heardos.spec
      - name: smoke test (headless commands work from the bundle)
        shell: bash
        run: |
          if [ -d dist/HeardOS.app ]; then B=dist/HeardOS.app/Contents/MacOS/HeardOS; elif [ -f dist/HeardOS.exe ]; then B=dist/HeardOS.exe; else B=dist/HeardOS; fi
          "$B" cli --help
      - name: package (keeps macOS symlinks and Linux exec bits)
        shell: bash
        run: |
          mkdir -p release
          case "${{ runner.os }}" in
            macOS)   ditto -c -k --keepParent dist/HeardOS.app release/HeardOS-macOS-arm64.zip ;;
            Windows) cp dist/HeardOS.exe release/HeardOS-Windows-x64.exe ;;
            Linux)   chmod +x dist/HeardOS && tar -C dist -czf release/HeardOS-Linux-x86_64.tar.gz HeardOS ;;
          esac
      - name: build provenance (signed by GitHub; verify with `gh attestation verify FILE -R OWNER/REPO`)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@<CALENDAR_ID> # v2
        with:
          subject-path: installer/release/*
      - uses: actions/upload-artifact@<CALENDAR_ID> # v4
        with:
          name: HeardOS-${{ runner.os }}
          path: installer/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@<CALENDAR_ID> # v4
        with: {path: release, merge-multiple: true}
      - name: publish the release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          (cd release && sha256sum * > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" release/* -R "${GITHUB_REPOSITORY}" --title "HeardOS installer ${GITHUB_REF_NAME}" --notes-file - <<'EOF'
          Desktop installer and day-two console for HeardOS. See installer/README.md for what it does and what you need.

          | File | For |
          |---|---|
          | HeardOS-Windows-x64.exe | Windows 10/11 |
          | HeardOS-macOS-arm64.zip | macOS 12+ on Apple silicon. Not notarised: right-click the app and choose Open the first time. |
          | HeardOS-Linux-x86_64.tar.gz | Linux x86-64 (or `pipx install ./installer` from a checkout) |

          Check a download: `sha256sum -c SHA256SUMS --ignore-missing`, and that it was built by this repository's workflow: `gh attestation verify FILE -R ${{ github.repository }}`.

          Status: the install has been verified end to end in dry-run mode only. A real install against a VPS and home server has not been run yet.
          EOF
