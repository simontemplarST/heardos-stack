# Home Assistant behind Traefik (bridge network, not host network: discovery protocols that need L2 can be
# added later with network_mode: host if you need them). OIDC via the hass-oidc-auth custom component.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4   # 2026.10.2
    container_name: homeassistant
    restart: unless-stopped
    environment: {TZ: "${TZ}"}
    volumes:
      - ${HEARDOS_ROOT}/data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    # host-only: 63-post-install.py ha-onboard and 62-ha-caldav.py use it. The companion app on the LAN uses
    # http://home.<LAN_DOMAIN> through Traefik (trusted_proxies = Traefik's /32), away from home https://home.<DOMAIN>.
    ports: ["127.0.0.1:8209:8123"]
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.home.rule: Host(`home.${DOMAIN}`)
      traefik.http.routers.home.entrypoints: web
      traefik.http.routers.home.middlewares: xfp-https@file
      traefik.http.routers.home-lan.rule: Host(`home.${LAN_DOMAIN}`)
      traefik.http.routers.home-lan.entrypoints: web
      traefik.http.services.home.loadbalancer.server.port: "8123"
networks:
  proxy: {external: true}
