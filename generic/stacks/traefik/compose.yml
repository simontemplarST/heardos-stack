# Traefik v3: the host's reverse proxy. Listens on :80 (LAN + overlay); Caddy on the VPS forwards public traffic here.
services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # trust X-Forwarded-* from the Nebula lighthouse (Caddy) and local docker networks so apps see real client IPs
      - --entrypoints.web.forwardedheaders.trustedips=${NEBULA_LH_OVERLAY}/32,${PROXY_SUBNET},127.0.0.1/32
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=false
    ports:
      - "80:80"                      # all interfaces: LAN clients and the overlay hop both land here; ufw limits the sources
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HEARDOS_ROOT}/dynamic:/dynamic:ro
    networks: [proxy]
    labels:
      # dashboard only on the LAN name, behind Authentik forward auth once it exists
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`traefik.${LAN_DOMAIN}`)
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.middlewares: authentik-fwd@file
networks:
  proxy:
    external: true
