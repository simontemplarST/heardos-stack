# Actual Budget server. OpenID via Authentik, enforced; the first person to sign in becomes the owner.
services:
  actual:
    image: actualbudget/actual-server:26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c   # 26.10.0
    container_name: actual
    restart: unless-stopped
    environment:
      ACTUAL_OPENID_DISCOVERY_URL: "https://auth.${DOMAIN}/application/o/actual-budget/.well-known/openid-configuration"
      ACTUAL_OPENID_CLIENT_ID: "${OIDC_CLIENT_ID}"
      ACTUAL_OPENID_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      ACTUAL_OPENID_SERVER_HOSTNAME: "https://budget.${DOMAIN}"
      ACTUAL_OPENID_ENFORCE: "true"
      ACTUAL_LOGIN_METHOD: openid
      ACTUAL_USER_CREATION_MODE: login
      ACTUAL_TRUSTED_PROXIES: "${TRAEFIK_PROXY_IP:?set TRAEFIK_PROXY_IP}/32,${NEBULA_LH_OVERLAY}/32"
    volumes: ["${HEARDOS_ROOT}/data/actual:/data"]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.budget.rule: Host(`budget.${DOMAIN}`)
      traefik.http.routers.budget.entrypoints: web
      traefik.http.routers.budget.middlewares: xfp-https@file
      traefik.http.routers.budget-lan.rule: Host(`budget.${LAN_DOMAIN}`)
      traefik.http.routers.budget-lan.entrypoints: web
      traefik.http.services.budget.loadbalancer.server.port: "5006"
networks:
  proxy: {external: true}
