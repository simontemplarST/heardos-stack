# Paperless-ngx with PostgreSQL and Redis. OIDC login via Authentik (allauth openid_connect).
services:
  broker:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes: ["${HEARDOS_ROOT}/data/paperless/redis:/data"]
    networks: [internal]
  db:
    image: ${PAPERLESS_PG_IMAGE:-postgres:17}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment: {POSTGRES_DB: paperless, POSTGRES_USER: paperless, POSTGRES_PASSWORD: "${PAPERLESS_DB_PASSWORD}"}
    volumes: ["${HEARDOS_ROOT}/data/paperless/postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"], interval: 10s, timeout: 5s, retries: 10}
    networks: [internal]
  webserver:
    container_name: paperless-webserver          # 63-post-install.py and paperless-gpt reach it by this name
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.2@sha256:d232cba37cc0bab0d6c6581ecd320383b7a6f49f33e0fd16adda4d009eb600dd   # 3.3.2
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}, broker: {condition: service_started}, gotenberg: {condition: service_started}, tika: {condition: service_started}}
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: "${PAPERLESS_DB_PASSWORD}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY}"
      PAPERLESS_TIME_ZONE: "${TZ}"
      PAPERLESS_URL: "https://paperless.${DOMAIN}"
      PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://paperless.${DOMAIN}${PAPERLESS_CSRF_LAN:-}"   # 50-app.sh adds the http:// LAN origin only with LAN_HTTP=1
      PAPERLESS_ALLOWED_HOSTS: "paperless.${DOMAIN},paperless.${LAN_DOMAIN},paperless-webserver"   # paperless-webserver: paperless-gpt calls the API by container name
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      USERMAP_GID: "${MEDIA_GID:-1500}"   # shared media group: Paperless can delete what Nextcloud drops into consume/
      PAPERLESS_ADMIN_USER: "${ADMIN_USER}"
      PAPERLESS_ADMIN_PASSWORD: "${PAPERLESS_ADMIN_PASSWORD}"
      PAPERLESS_ADMIN_MAIL: "${ADMIN_EMAIL}"
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"   # skip the login form when an Authentik session exists
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"authentik","name":"HeardOS","client_id":"${OIDC_CLIENT_ID}","secret":"${OIDC_CLIENT_SECRET}","settings":{"server_url":"https://auth.${DOMAIN}/application/o/paperless/.well-known/openid-configuration"}}]}}'
      PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https
      # OCR: built-in OCRmyPDF/Tesseract on every page without a text layer (settings below). The optional heardos-ocr
      # stack (50-app.sh ocr) can take over by setting PAPERLESS_REMOTE_OCR_ENGINE=azureai in this stack's .env.
      PAPERLESS_REMOTE_OCR_ENGINE: "${PAPERLESS_REMOTE_OCR_ENGINE:-}"
      PAPERLESS_REMOTE_OCR_ENDPOINT: "http://heardos-ocr:8000"
      PAPERLESS_REMOTE_OCR_API_KEY: "${OCR_API_KEY}"
      PAPERLESS_REMOTE_OCR_MODE: always
      PAPERLESS_REMOTE_OCR_ALLOW_INTERNAL_ENDPOINTS: "true"
      PAPERLESS_OCR_LANGUAGE: "${OCR_LANGS:-eng}"
      PAPERLESS_OCR_MODE: skip
      PAPERLESS_OCR_SKIP_ARCHIVE_FILE: never
      PAPERLESS_OCR_OUTPUT_TYPE: pdfa
      PAPERLESS_OCR_ROTATE_PAGES: "true"
      PAPERLESS_OCR_DESKEW: "true"
      PAPERLESS_OCR_CLEAN: clean
      PAPERLESS_OCR_IMAGE_DPI: "300"
      PAPERLESS_OCR_MAX_IMAGE_PIXELS: "0"
      # Office documents and emails (.eml): Tika extracts text, Gotenberg renders them to PDF (2026-10-28, for the email import)
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    volumes:
      - ${HEARDOS_ROOT}/data/paperless/data:/usr/src/paperless/data
      - ${HEARDOS_ROOT}/data/paperless/media:/usr/src/paperless/media
      - ${HEARDOS_ROOT}/data/paperless/export:/usr/src/paperless/export
      - ${HEARDOS_ROOT}/data/paperless/consume:/usr/src/paperless/consume
    networks: [internal, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.paperless.rule: Host(`paperless.${DOMAIN}`)
      traefik.http.routers.paperless.entrypoints: web
      traefik.http.routers.paperless.middlewares: xfp-https@file
      traefik.http.routers.paperless-lan.rule: Host(`paperless.${LAN_DOMAIN}`)
      traefik.http.routers.paperless-lan.entrypoints: web
      traefik.http.services.paperless.loadbalancer.server.port: "8000"
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    restart: unless-stopped
    # renders emails to PDF with Chromium: no JavaScript, and nothing may be loaded except the temp files Paperless hands
    # over (no tracking pixels, no remote or internal URLs from an email's HTML) — same flags as paperless-ngx's own compose
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=^file:///tmp/.*"]
    mem_limit: 1g
    networks: [internal]
  tika:
    image: apache/tika:3.3.1.0
    restart: unless-stopped
    mem_limit: 1g
    networks: [internal]
networks:
  internal: {}
  proxy: {external: true}
