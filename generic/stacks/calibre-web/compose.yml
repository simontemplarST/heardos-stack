# Calibre-Web (ebook library). Header login: Authentik forward auth passes X-authentik-username; the LAN route strips it.
# Calibre's own tools (ebook-convert, calibredb) come from the linuxserver universal-calibre mod.
services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27-ls406@sha256:b206b791d77b731203fb47b5733d055c8d4ebd7c9fa59a4569a5d6a2b3ebda54   # 0.6.27-ls406
    container_name: calibre-web
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ}"
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - ${HEARDOS_ROOT}/data/calibre-web:/config
      - ${HEARDOS_ROOT}/media/books:/books
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.books-outpost.rule: Host(`books.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.books-outpost.entrypoints: web
      traefik.http.routers.books-outpost.priority: "100"
      traefik.http.routers.books-outpost.service: authentik-outpost@file
      traefik.http.routers.books-outpost.middlewares: xfp-https@file
      traefik.http.routers.books.rule: Host(`books.${DOMAIN}`)
      traefik.http.routers.books.entrypoints: web
      traefik.http.routers.books.middlewares: xfp-https@file,authentik-fwd@file
      traefik.http.routers.books.service: books
      traefik.http.routers.books-lan.rule: Host(`books.${LAN_DOMAIN}`)
      traefik.http.routers.books-lan.entrypoints: web
      traefik.http.routers.books-lan.middlewares: strip-authentik@file
      traefik.http.routers.books-lan.service: books
      traefik.http.services.books.loadbalancer.server.port: "8083"
networks:
  proxy: {external: true}
