# Homepage: the family hub (big plain-word tiles). Behind Authentik forward auth. Config is generated by lib/homepage-config.py.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.6.0@sha256:3e38fe788223cb46a3ce1f046ef11667b40f7707fdca0dcbfa3f86c5c42bf1e8   # v2.6.0
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "hub.${DOMAIN},hub.${LAN_DOMAIN}"
      PUID: "1000"
      PGID: "1000"
    volumes: ["${HEARDOS_ROOT}/data/homepage:/app/config"]
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.hub-outpost.rule: Host(`hub.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.hub-outpost.entrypoints: web
      traefik.http.routers.hub-outpost.priority: "100"
      traefik.http.routers.hub-outpost.service: authentik-outpost@file
      traefik.http.routers.hub-outpost.middlewares: xfp-https@file
      traefik.http.routers.hub.rule: Host(`hub.${DOMAIN}`)
      traefik.http.routers.hub.entrypoints: web
      traefik.http.routers.hub.middlewares: xfp-https@file,authentik-fwd@file
      traefik.http.routers.hub.service: hub
      traefik.http.routers.hub-lan.rule: Host(`hub.${LAN_DOMAIN}`)
      traefik.http.routers.hub-lan.entrypoints: web
      traefik.http.routers.hub-lan.service: hub
      traefik.http.services.hub.loadbalancer.server.port: "3000"
networks:
  proxy: {external: true}
