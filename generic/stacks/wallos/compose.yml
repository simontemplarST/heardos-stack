# Wallos (subscriptions). Authentik OIDC through Wallos' OIDC_* env; password login disabled, users auto-created.
services:
  wallos:
    image: bellamy/wallos:5.10.0@sha256:6d67b6e21dbb978dff113d01860311221adccc53151c033120f113e11a63d1e7   # 5.10.0
    container_name: wallos
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      OIDC_ENABLED: "true"
      OIDC_PROVIDER_NAME: "${BRAND_TITLE:-HeardOS}"
      OIDC_ISSUER: "https://auth.${DOMAIN}/application/o/wallos/"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OIDC_REDIRECT_URL: "https://wallos.${DOMAIN}/"
      OIDC_LOGOUT_URL: "https://auth.${DOMAIN}/application/o/wallos/end-session/"
      OIDC_USER_IDENTIFIER: sub
      OIDC_SCOPES: "openid email profile"
      OIDC_AUTO_CREATE_USER: "true"
      OIDC_DISABLE_PASSWORD_LOGIN: "true"
      OIDC_REQUIRE_EMAIL_VERIFIED: "true"
    volumes:
      - ${HEARDOS_ROOT}/data/wallos/db:/var/www/html/db
      - ${HEARDOS_ROOT}/data/wallos/logos:/var/www/html/images/uploads/logos
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.wallos.rule: Host(`wallos.${DOMAIN}`)
      traefik.http.routers.wallos.entrypoints: web
      traefik.http.routers.wallos.middlewares: xfp-https@file
      traefik.http.routers.wallos-lan.rule: Host(`wallos.${LAN_DOMAIN}`)
      traefik.http.routers.wallos-lan.entrypoints: web
      traefik.http.services.wallos.loadbalancer.server.port: "80"
networks:
  proxy: {external: true}
