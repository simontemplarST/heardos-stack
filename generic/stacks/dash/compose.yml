# HeardOS desktop (dash.$DOMAIN): a web desktop where every app opens signed in, in a window (see docs/web-desktop.md).
# One small Node container built on the host from apps/dash; it also reads Mealie, Homebox and Actual for the "This week"
# app and widgets (each source optional). It trusts the X-authentik-* headers, so it has NO route that skips the gate.
# Gate secret: the dash router adds X-Dash-Gate (middleware dash-gate, after authentik-fwd) and server.js answers 403 to
# anything without it, so other containers on the shared proxy network can't reach it directly with forged headers.
# 50-app.sh builds the image (docker build apps/dash -> heardos-dash:local) before deploying, so Portainer never needs a build context.
services:
  dash:
    image: heardos-dash:local
    container_name: dash
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      DOMAIN: "${DOMAIN}"
      DASH_GATE_SECRET: "${DASH_GATE_SECRET:?DASH_GATE_SECRET missing (50-app.sh dash generates it)}"
      # Help tells people whom to ask; the System app and /api/diagnostics are for members of DASH_ADMIN_GROUP
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-}"
      SUPPORT_NAME: "${SUPPORT_NAME:-}"
      DASH_ADMIN_GROUP: "${DASH_ADMIN_GROUP:-authentik Admins}"
      # APPS_FILE: /config/apps.json   # with the volume below: edit the catalogue without rebuilding (apps/dash/README.md)
      CACHE_SECONDS: "180"
      MEALIE_URL: http://mealie:9000
      MEALIE_PUBLIC_URL: "${MEALIE_PUBLIC_URL}"
      MEALIE_TOKEN: "${MEALIE_TOKEN}"
      HOMEBOX_URL: http://homebox:7745
      HOMEBOX_PUBLIC_URL: "${HOMEBOX_PUBLIC_URL}"
      HOMEBOX_API_KEY: "${HOMEBOX_API_KEY}"
      ACTUAL_URL: http://actual:5006
      ACTUAL_PUBLIC_URL: "${ACTUAL_PUBLIC_URL}"
      ACTUAL_SYNC_ID: "${ACTUAL_SYNC_ID}"
      ACTUAL_PASSWORD: "${ACTUAL_PASSWORD}"
    volumes:
      - "${HEARDOS_ROOT}/data/dash:/data"
      # - "${HEARDOS_ROOT}/data/dash/apps.json:/config/apps.json:ro"   # optional: your own catalogue (set APPS_FILE above)
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dash-outpost.rule: Host(`dash.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.dash-outpost.entrypoints: web
      traefik.http.routers.dash-outpost.priority: "100"
      traefik.http.routers.dash-outpost.service: authentik-outpost@file
      traefik.http.routers.dash-outpost.middlewares: xfp-https@file
      traefik.http.routers.dash.rule: Host(`dash.${DOMAIN}`)
      traefik.http.routers.dash.entrypoints: web
      traefik.http.routers.dash.middlewares: xfp-https@file,authentik-fwd@file,dash-gate@docker
      traefik.http.middlewares.dash-gate.headers.customrequestheaders.X-Dash-Gate: "${DASH_GATE_SECRET}"
      traefik.http.routers.dash.service: dash
      traefik.http.services.dash.loadbalancer.server.port: "8080"
networks:
  proxy: {external: true}
