# Open WebUI: the chat front end for the HeardOS model harness (heardos-serve, plan CHAT_HARNESS_URL + secret
# CHAT_HARNESS_KEY) and the local Ollama of the paperless-gpt stack. Sign-in only through Authentik (OIDC app `chat`,
# group app-chat; "authentik Admins" become Open WebUI admins). Settings live here (ENABLE_PERSISTENT_CONFIG=false).
# Break-glass: https://chat.<domain>/auth?form=1
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def   # v0.12.3
    container_name: open-webui
    restart: unless-stopped
    environment:
      WEBUI_URL: "https://chat.${DOMAIN}"
      WEBUI_NAME: Chat
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
      OAUTH_AUTO_REDIRECT: "true"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      OAUTH_PROVIDER_NAME: "${BRAND_TITLE}"
      OPENID_PROVIDER_URL: "https://auth.${DOMAIN}/application/o/chat/.well-known/openid-configuration"
      OPENID_REDIRECT_URI: "https://chat.${DOMAIN}/oauth/oidc/callback"
      OAUTH_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OAUTH_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OAUTH_SCOPES: openid profile email
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ALLOWED_ROLES: app-chat,authentik Admins
      OAUTH_ADMIN_ROLES: authentik Admins
      DEFAULT_USER_ROLE: user
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: "${CHAT_HARNESS_URL}"
      OPENAI_API_KEYS: "${CHAT_HARNESS_KEY}"
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URLS: http://ollama:11434
      DEFAULT_MODELS: heardos
      TASK_MODEL: "${PAPERLESS_GPT_MODEL}"
      TASK_MODEL_EXTERNAL: "${PAPERLESS_GPT_MODEL}"
      ENABLE_TITLE_GENERATION: "true"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_CHANNELS: "false"
      RAG_EMBEDDING_ENGINE: ollama
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - ${HEARDOS_ROOT}/data/open-webui:/app/backend/data
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 4g
    networks: [proxy, ollama]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.chat.rule: Host(`chat.${DOMAIN}`)
      traefik.http.routers.chat.entrypoints: web
      traefik.http.routers.chat.middlewares: xfp-https@file
      traefik.http.routers.chat-lan.rule: Host(`chat.${LAN_DOMAIN}`)
      traefik.http.routers.chat-lan.entrypoints: web
      traefik.http.services.chat.loadbalancer.server.port: "8080"
networks:
  proxy: {external: true}
  ollama:
    name: paperless-gpt_internal
    external: true
