# Authentik (server + worker + PostgreSQL + Redis). Secrets come from .env (written by 40-authentik-stack.sh).
# Bootstrap env vars create akadmin's password and an API token on first start, so no UI step is needed. They are in .env
# only until 40-authentik-stack.sh has handed over to the `heardos-automation` service account; afterwards .env no longer
# has them (empty = Authentik's bootstrap blueprint skips the token) and the bootstrap token is deleted.
# Images are pinned by digest (multi-arch index). To upgrade: set AUTHENTIK_IMAGE in .env, or update the pins here:
#   skopeo inspect --raw docker://ghcr.io/goauthentik/server:<tag> | sha256sum
services:
  postgresql:
    image: ${AUTHENTIK_PG_IMAGE:-postgres:18-alpine}   # 18: the data dir is /var/lib/postgresql/18/docker, so the parent is mounted
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes: ["${HEARDOS_ROOT}/data/authentik/postgres:/var/lib/postgresql"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s}
    networks: [internal]
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes: ["${HEARDOS_ROOT}/data/authentik/redis:/data"]
    healthcheck: {test: ["CMD-SHELL", "redis-cli ping | grep PONG"], interval: 10s, timeout: 3s, retries: 5}
    networks: [internal]
  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c}
    container_name: authentik-server          # the dynamic config and other stacks reach it by this name
    restart: unless-stopped
    command: server
    security_opt: ["no-new-privileges:true"]
    environment: &ak_env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}   # first start only (see header)
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${ADMIN_EMAIL}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # outgoing mail (password resets, invitations); written by 43-authentik-mail.sh, empty = mail off
      AUTHENTIK_EMAIL__HOST: ${EMAIL_HOST:-localhost}
      AUTHENTIK_EMAIL__PORT: ${EMAIL_PORT:-25}
      AUTHENTIK_EMAIL__USERNAME: ${EMAIL_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${EMAIL_PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${EMAIL_USE_TLS:-false}
      AUTHENTIK_EMAIL__USE_SSL: ${EMAIL_USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: "15"
      AUTHENTIK_EMAIL__FROM: ${EMAIL_FROM:-}
      TZ: ${TZ}
    volumes:
      - ${HEARDOS_ROOT}/data/authentik/media:/media
      - ${HEARDOS_ROOT}/data/authentik/templates:/templates
    ports:
      - "${AUTHENTIK_API_BIND:-${HOST_LAN_IP}}:9000:9000"   # API/UI for the automation scripts (plan AUTHENTIK_API_BIND=127.0.0.1 keeps it off the LAN); public access goes through Traefik
    depends_on: {postgresql: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [internal, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.authentik.rule: Host(`auth.${DOMAIN}`)
      traefik.http.routers.authentik.entrypoints: web
      traefik.http.routers.authentik.middlewares: xfp-https@file
      traefik.http.routers.authentik-lan.rule: Host(`auth.${LAN_DOMAIN}`)
      traefik.http.routers.authentik-lan.entrypoints: web
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c}
    restart: unless-stopped
    command: worker
    environment: *ak_env
    # no `user: root`: that is only needed for the Docker-socket outpost integration, which this kit does not use
    # (outposts are embedded). Runs as the image's uid 1000; 40-authentik-stack.sh chowns media/templates/certs to it.
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${HEARDOS_ROOT}/data/authentik/media:/media
      - ${HEARDOS_ROOT}/data/authentik/templates:/templates
      - ${HEARDOS_ROOT}/data/authentik/certs:/certs
    depends_on: {postgresql: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [internal]
networks:
  internal: {}
  proxy:
    external: true
