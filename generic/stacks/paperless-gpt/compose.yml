# paperless-gpt + Ollama: AI titles, correspondents and dates for Paperless on the CPU (llama3.2:3b, ~30-60 s per document).
# Fully automatic: `63-post-install.py paperless-gpt` creates a Paperless workflow that tags new documents paperless-gpt-auto.
# Tags and document types stay with Paperless's own matching rules (a 3B model over-tags). No OCR here. No route at all.
services:
  ollama:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7   # 0.40.6
    container_name: ollama
    restart: unless-stopped
    cpus: ${OLLAMA_CPUS:-6}
    mem_limit: ${OLLAMA_MEM:-6g}   # llama3.2:3b needs ~3-4 GB; raise for bigger models
    security_opt: ["no-new-privileges:true"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
      # a 7B model fits a 6 GB card with the KV cache in 8-bit (needs flash attention); harmless on the CPU
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes: ["${HEARDOS_ROOT}/data/ollama:/root/.ollama"]
    networks: [internal]
  paperless-gpt:
    image: icereed/paperless-gpt:v0.31.0
    container_name: paperless-gpt
    restart: unless-stopped
    environment:
      PAPERLESS_BASE_URL: http://paperless-webserver:8000
      PAPERLESS_PUBLIC_URL: "https://paperless.${DOMAIN}"
      PAPERLESS_API_TOKEN: "${PAPERLESS_GPT_TOKEN}"
      MANUAL_TAG: paperless-gpt
      AUTO_TAG: paperless-gpt-auto
      LLM_PROVIDER: ollama
      LLM_MODEL: "${PAPERLESS_GPT_MODEL:-llama3.2:3b}"
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_TIMEOUT_SECONDS: "300"
      TOKEN_LIMIT: "2500"
      LLM_LANGUAGE: English
      LLM_TEMPERATURE: "0"
      SUGGESTION_WORKERS: "1"
      AUTO_GENERATE_TITLE: "true"
      AUTO_GENERATE_TAGS: "false"
      AUTO_GENERATE_CORRESPONDENTS: "true"
      AUTO_GENERATE_DOCUMENT_TYPE: "false"
      AUTO_GENERATE_CREATED_DATE: "true"
      CREATE_NEW_TAGS: "false"
      PRESERVE_EXISTING_METADATA: "true"
    volumes: ["${HEARDOS_ROOT}/data/paperless-gpt/prompts:/app/prompts"]
    depends_on: [ollama]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy, internal]
networks:
  proxy: {external: true}
  internal: {name: paperless-gpt_internal}
